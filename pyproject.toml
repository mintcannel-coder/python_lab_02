[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamstats"
version = "0.1.0"
description = "Потоковый анализатор логов (CSV и JSONL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/streamstats"]